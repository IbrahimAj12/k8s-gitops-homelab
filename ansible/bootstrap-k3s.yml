---
- name: Prepare all LXC nodes for K3s
  hosts: k3s_cluster
  tasks:
    - name: Install required base packages
      ansible.builtin.apt:
        name: [curl, ca-certificates, open-iscsi]
        state: present
        update_cache: true

    - name: Ensure /dev/kmsg symlink exists for kubelet in LXC
      ansible.builtin.file:
        src: /dev/console
        dest: /dev/kmsg
        state: link
        force: true

    - name: Persist /dev/kmsg symlink across container reboots
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/kmsg.conf
        content: "L /dev/kmsg - - - - /dev/console\n"
        mode: '0644'

- name: Install K3s Server (Control Plane)
  hosts: k3s_control
  tasks:
    - name: Install K3s server binary and service
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --tls-san 192.168.0.210 --flannel-backend=host-gw" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s node-token to be generated
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token

    - name: Read K3s join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_b64

    - name: Fetch kubeconfig to local laptop (~/.kube/config)
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        flat: true

    - name: Replace loopback IP with control-plane IP in local kubeconfig
      ansible.builtin.replace:
        path: "{{ lookup('env', 'HOME') }}/.kube/config"
        regexp: '127\.0\.0\.1'
        replace: '192.168.0.210'
      delegate_to: localhost

    - name: Secure local kubeconfig permissions (0600)
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube/config"
        mode: '0600'
      delegate_to: localhost

- name: Install K3s Agents (Worker Nodes)
  hosts: k3s_workers
  tasks:
    - name: Join worker nodes to k3s-control-1
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | K3S_URL="https://192.168.0.210:6443" K3S_TOKEN="{{ hostvars['k3s-control-1']['k3s_token_b64']['content'] | b64decode | trim }}" sh -
      args:
        creates: /usr/local/bin/k3s-agent
